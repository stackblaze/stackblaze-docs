# StackBlaze docs on leaseweb-montreal: namespace docs, image tag :main.
# Served at docs-origin.stackblaze.com; the website (Vercel) forwards www.stackblaze.com/docs/* here.
# Apply: kubectl --context leaseweb-montreal apply -f deploy/docs.yaml
# Roll out a new image: kubectl --context leaseweb-montreal -n docs rollout restart deploy/docs
apiVersion: v1
kind: Namespace
metadata:
  name: docs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs
  namespace: docs
  labels: { app: docs }
spec:
  replicas: 1
  selector:
    matchLabels: { app: docs }
  template:
    metadata:
      labels: { app: docs }
    spec:
      containers:
        - name: docs
          image: ghcr.io/stackblaze/stackblaze-docs:main
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: { path: /docs, port: 3000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /docs, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
---
apiVersion: v1
kind: Service
metadata:
  name: docs
  namespace: docs
spec:
  selector: { app: docs }
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docs
  namespace: docs
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts: [docs-origin.stackblaze.com]
      secretName: docs-tls
  rules:
    - host: docs-origin.stackblaze.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: docs
                port: { number: 80 }
