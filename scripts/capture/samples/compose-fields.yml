version: "3.9"
services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile.prod
      args:
        NODE_ENV: production
    ports:
      - "8080:3000"
      - "9229:9229"
    environment:
      DATABASE_URL: postgres://app:secret@db:5432/appdb
      CACHE_HOST: cache
      API_KEY: ${API_KEY}
    command: npm start
    volumes:
      - uploads:/app/uploads
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
    depends_on:
      - db
      - cache
  worker:
    image: ghcr.io/acme/worker:1.4
    command: ["node", "worker.js"]
    environment:
      - QUEUE=jobs
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
  cache:
    image: redis:7
volumes:
  uploads:
