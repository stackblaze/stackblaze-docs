services:
  web:
    image: nginx:1.27
    ports:
      - "8080:80"
    environment:
      DATABASE_URL: postgres://app:app@db:5432/appdb
      REDIS_HOST: cache
      GREETING: ${GREETING}
    depends_on:
      - db
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: app
  cache:
    image: redis:7
